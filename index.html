<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petualangan Si Kata</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="homeBtn" aria-label="Beranda">⌂</button>
      <div class="progress-wrap">
        <div class="world-label" id="worldLabel">Dunia 1</div>
        <div class="progress"><div id="progressBar"></div></div>
      </div>
      <div class="stars">⭐ <span id="starCount">0</span></div>
    </header>

    <main>
      <section id="homeScreen" class="screen active">
        <div class="hero">
          <div class="hero-icon">📚</div>
          <h1>Petualangan<br><span>Si Kata</span></h1>
          <p>Belajar membaca sambil bermain!</p>
          <button class="primary-btn" id="startBtn">▶ MULAI BERMAIN</button>
          <div class="home-stats">
            <div><b id="homeLevel">1</b><small>Level</small></div>
            <div><b id="homeStars">0</b><small>Bintang</small></div>
            <div><b id="homeBest">0</b><small>Terbaik</small></div>
          </div>
        </div>
      </section>

      <section id="mapScreen" class="screen">
        <div class="section-title">
          <h2>🗺️ Peta Petualangan</h2>
          <p>Pilih level yang sudah terbuka.</p>
        </div>
        <div id="worlds"></div>
      </section>

      <section id="gameScreen" class="screen">
        <div class="level-head">
          <div>
            <span id="levelWorld">Dunia 1</span>
            <h2 id="levelTitle">Level 1</h2>
          </div>
        </div>

        <div class="character-stage">
            <div class="character" id="character">🧒</div>
            <div class="speech-bubble" id="speechBubble">Ayo kita belajar membaca!</div>
          </div>
          <div class="audio-row">
            <button class="audio-main" id="speakBtn">🔊 DENGARKAN</button>
            <button class="audio-mini" id="repeatBtn" title="Ulangi suara">↻</button>
            <span id="audioStatus">Audio siap</span>
          </div>
          <div class="game-card">
          <div class="instruction" id="instruction">Pilih jawaban yang benar.</div>
          <div class="question" id="question">A</div>
          <div id="options" class="options"></div>
          <div id="feedback" class="feedback hidden"></div>
          <button id="nextBtn" class="primary-btn hidden">LANJUT ▶</button>
        </div>
      </section>

      <section id="resultScreen" class="screen">
        <div class="result-card">
          <div class="result-emoji" id="resultEmoji">🎉</div>
          <h2 id="resultTitle">Hebat!</h2>
          <p id="resultText">Kamu berhasil menyelesaikan level.</p>
          <div class="earned-stars" id="earnedStars">⭐⭐⭐</div>
          <button class="primary-btn" id="resultNextBtn">LEVEL BERIKUTNYA ▶</button>
          <button class="secondary-btn" id="mapBtn">🗺️ KEMBALI KE PETA</button>
        </div>
      </section>
    </main>

    <div class="toast" id="toast"></div>
  </div>
  <script src="js/levels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
